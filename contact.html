<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liên hệ - Lê Minh Đăng</title>
    <link rel="icon" href="images/logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav>
        <a href="index.html" class="brand">
            <img src="images/logo.svg" alt="Logo Lê Minh Đăng" class="logo">
        </a>
        <a href="index.html">Trang chủ</a>
        <a href="about.html">Giới thiệu</a>
        <a href="contact.html">Liên hệ</a>
    </nav>

    <header>
        <img src="images/avatar.jpg" alt="Ảnh chân dung Lê Minh Đăng" class="avatar">
        <h1>Liên hệ với mình</h1>
        <p>Rất vui được kết nối và trao đổi cùng bạn</p>
    </header>

    <section>
        <h2>Thông tin liên hệ</h2>
        <div class="project">
            <p>Email: leminhdang@example.com</p>
            <p>SĐT: 0392911503</p>
            <p>Địa chỉ: TP. Hồ Chí Minh</p>
        </div>

        <h2>Gửi lời nhắn</h2>
        <form class="project" id="contact-form">
            <label for="name">Họ và tên</label>
            <input type="text" id="name" placeholder="Nhập họ và tên" required>

            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Nhập email của bạn" required>

            <label for="message">Nội dung</label>
            <textarea id="message" rows="5" placeholder="Bạn muốn nhắn gì với mình?" required></textarea>

            <button type="submit">Gửi lời nhắn</button>
        </form>
    </section>

    <footer>
        <p>&copy; 2026 Lê Minh Đăng. Bài tập môn Thiết kế Web.</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
